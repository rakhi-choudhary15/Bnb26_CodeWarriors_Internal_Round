[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorai-backend"
version = "0.1.0"
description = "GenZCreators intent-driven creator operating system — API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyJWT>=2.9",
]

[project.optional-dependencies]
# PostgreSQL driver is required only for the Supabase/Postgres deployment path.
postgres = ["psycopg2-binary>=2.9.9"]
# Redis-backed RQ queue is required only when REDIS_URL points at a live server.
redis = ["redis>=5.0", "rq>=1.16"]
# Image/vector work. Kept optional so the core test suite installs fast.
media = ["opencv-python-headless>=4.10", "python-magic>=0.4.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyJWT>=1.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI dependencies are call-in-defaults by design.
# E501: line length is enforced by the formatter, not the linter.
# UP042: the domain enums stay `(str, Enum)` on purpose. They are persisted in
#   Postgres enum columns and compared against raw strings from JSON payloads and
#   SQLAlchemy `Enum` columns; switching to `StrEnum` would change `str(member)`
#   for every enum in `app/core/models.py` with no behavioural gain (AGENTS.md §4.2).
ignore = ["B008", "E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
exclude = "migrations"

[tool.black]
line-length = 88