[alembic]
# The URL is set at runtime in migrations/env.py from app.core.config.settings.
# Anything written here would be a second place to configure the database (§18).
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Format the generated revision immediately (AGENTS.md rule 21: schema change and
# its documentation land together). The `exec` form is used instead of
# `console_scripts` because entry-point lookup for console scripts is unreliable
# on Python 3.14, which silently turned every `alembic revision` into an error.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
